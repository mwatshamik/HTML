<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML FORM</title>
</head>
<body>
    <form>
        <label for="fname">Full Name:</label>
        <input type="text" id="fname" name="fname"><br><br>
        <label for="email">Email Address:</label>
        <input type="email" id="email" name="email"><br><br>
        <label for="pass">Password:</label>
        <input type="password" id="pass" name="pass"><br><br>
        <label for="gender">Gender:</label>
        <p>select your gender:</p>
        <input type="radio" id="male" name="gender" value="male" checked>
        <label for="male">Male:</label>
        <input type="radio" id="female" name="gender" value="female" checked>
        <label for="female">Female:</label><br><br>
        <label for="check">Checkbox:</label>
        <input type="checkbox" id="check" name="check">
        <label for="check">I agree to the terms and conditions</label><br><br>
        <label for="country">select your country:</label>
        <select id="country" name="country">
            <option value="kenya">Kenya</option>
            <option value="tanzania">Tanzania</option>
            <option value="uganda">Uganda</option>
            <option value="rwanda">Rwanda</option>
        </select><br><br>
        <label for="message">Message:</label><br>
        <textarea id="message" name="message" rows="8" cols="50" placeholder="type your message here" required></textarea><br><br>
        <p>click the submit button to submit your form</p>

        <button type="submit" value="Submit">Submit</button>
    </form>
</body>
</html>
